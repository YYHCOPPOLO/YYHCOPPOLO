name: Snake

# Replays the contribution grid as a snake game and publishes the result to the
# `output` branch, where the README picks it up through <picture> elements.
on:
  schedule:
    # once a day, a little after GitHub has refreshed the contribution graph
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#8b5cf6&color_dots=#e8eefb,#c2d5f6,#93b3ec,#628ce0,#3b6fd4
            dist/snake-dark.svg?color_snake=#bb9af7&color_dots=#242838,#2b3d6b,#3e5da8,#5d84e0,#7aa2f7

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
