<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Alleva Coppolo — front-end learner and UI/UX explorer</title>
  <desc id="desc">An aurora banner in dark mode with the name Alleva Coppolo, the handle YYHCOPPOLO, the site coppolo.cn and a glass profile card showing a contribution heatmap.</desc>
  <style>
    .pulse { animation: pulse 3.4s ease-in-out infinite; }
    .drift { animation: drift 22s ease-in-out infinite alternate; }
    .drift-1 { animation-duration: 27s; animation-delay: -7s; }
    .drift-2 { animation-duration: 31s; animation-delay: -13s; }
    @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.3 } }
    @keyframes drift { from { transform: translate(0, 0) } to { transform: translate(0, 20px) } }
    @media (prefers-reduced-motion: reduce) { .pulse, .drift { animation: none !important; } }
  </style>
