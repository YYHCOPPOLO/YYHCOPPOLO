<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Alleva Coppolo — front-end learner and UI/UX explorer</title>
  <desc id="desc">A compact dark aurora banner with the name Alleva Coppolo, handle YYHCOPPOLO, website coppolo.cn, and a small interface illustration.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="0.55" stop-color="#16161e"/>
      <stop offset="1" stop-color="#1a1b26"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
