    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#c0caf5" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <g>
