      <rect x="988" y="168" width="38" height="8" rx="4" fill="#bb9af7" fill-opacity="0.45"/>
      <rect x="1034" y="168" width="72" height="8" rx="4" fill="#7dcfff" fill-opacity="0.32"/>

      <path d="M924 204 C 946 204, 948 190, 968 193 S 1002 202, 1018 190 S 1048 178, 1124 184" fill="none" stroke="url(#chartStroke)" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
      <circle cx="1124" cy="184" r="3.5" fill="#bb9af7"/>
      <circle cx="1124" cy="184" r="7" fill="none" stroke="#bb9af7" stroke-opacity="0.35"/>
