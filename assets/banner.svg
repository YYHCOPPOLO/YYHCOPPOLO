<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Alleva Coppolo — front-end learner and UI/UX explorer</title>
  <desc id="desc">A dark aurora banner with the name Alleva Coppolo, handle YYHCOPPOLO, website coppolo.cn, and layered interface cards.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="0.55" stop-color="#16161e"/>
      <stop offset="1" stop-color="#1a1b26"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dcfff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="chartStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c0caf5" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <g>
    <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
    <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
    <circle cx="120" cy="20" r="380" fill="url(#glowA)"/>
    <circle cx="1110" cy="330" r="400" fill="url(#glowB)"/>
    <circle cx="780" cy="40" r="260" fill="url(#glowC)"/>
    <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="23.25" fill="none" stroke="#2f3549" stroke-width="1.5"/>
  </g>

  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="72" y="70" width="206" height="30" rx="15" fill="#7aa2f7" fill-opacity="0.10" stroke="#7aa2f7" stroke-opacity="0.30"/>
    <circle cx="90" cy="85" r="3" fill="#9ece6a"/>
    <text x="103" y="89.5" font-size="11" font-weight="600" letter-spacing="2.2" fill="#7aa2f7">FRONT-END · UI/UX</text>

    <text x="72" y="177" font-size="56" font-weight="700" letter-spacing="0.2" fill="#e6e9f5">Alleva Coppolo</text>
    <text x="74" y="218" font-size="18" font-weight="500" letter-spacing="0.4" fill="#a9b8e8">@YYHCOPPOLO</text>
    <circle cx="212" cy="212" r="2.5" fill="#565f89"/>
    <text x="228" y="218" font-size="18" font-weight="400" letter-spacing="0.3" fill="#8f96bd">coppolo.cn</text>

    <text x="72" y="272" font-size="19" font-weight="400" letter-spacing="0.3" fill="#a9b1d6">Turning curious ideas into usable interfaces.</text>
  </g>

