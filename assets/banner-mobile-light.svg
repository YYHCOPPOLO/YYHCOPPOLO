      <stop offset="0.55" stop-color="#7dcfff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m-name" x1="0" y1="0" x2="1" y2="0.55">
